<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأوائل التعليمية</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background: var(--card); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        header h1 { margin: 0; font-size: 20px; color: var(--primary); }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: block; text-align: center; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        input, select { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .class-box { background: #f1f5f9; border-right: 4px solid var(--primary); padding: 15px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header>
        <h1>🎓 منصة الأوائل التعليمية</h1>
        {% if session.get('user') %}
            <div>
                <span>أهلاً، {{ session['user'].name }}</span> | 
                <a href="/logout" style="color:#ef4444; text-decoration:none;">خروج</a>
            </div>
        {% endif %}
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
