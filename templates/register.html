<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - {{ role_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm style-card" style="width: 100%; max-width: 420px;">
    <h4 class="text-center mb-3">إنشاء حساب {{ role_name }} جديد 📝</h4>
    <form action="/register/{{ role }}" method="POST">
        <input type="text" name="name" class="form-control mb-2" placeholder="الاسم الكامل" required>
        <input type="email" name="email" class="form-control mb-2" placeholder="البريد الإلكتروني (الإيميل)" required>
        <input type="password" name="password" class="form-control mb-2" placeholder="كلمة السر" required>

        {% if role == 'teacher' %}
        <select name="subject" class="form-select mb-2" required>
            <option value="">اختر المادة التي تدرسها</option>
            {% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
        {% else %}
        <select name="grade" class="form-select mb-2" required>
            <option value="">اختر الصف الدراسي</option>
            {% for g in grades %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
        </select>
        {% endif %}

        <button class="btn btn-success w-100 py-2 mt-2">إنشاء الحساب</button>
    </form>
    <div class="text-center mt-3">
        <small>لديك حساب بالفعل؟ <a href="/login/{{ role }}">تسجيل الدخول</a></small>
    </div>
</div>
</body>
</html>
